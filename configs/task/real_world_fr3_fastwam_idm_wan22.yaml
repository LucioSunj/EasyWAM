# @package _global_

defaults:
  - override /data: real_world_fr3
  - override /model: fastwam_idm_wan22
  - _self_

# Native full-parameter IDM training. These are initial settings, not an
# experimentally tuned FR3 schedule. Batch size is per process.
batch_size: 16
num_workers: 8
lr_scheduler_type: cosine
learning_rate: 1e-4
max_steps: 20000
log_every: 100
save_every: 2000
eval_every: 1000
eval_num_inference_steps: 10
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
